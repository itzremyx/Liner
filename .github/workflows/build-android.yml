name: Build Android APK

on:
  workflow_dispatch: # Manuel trigger
  push:
    branches:
      - modded
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04  # Explicitly use Ubuntu 24.04 to avoid migration warning
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'  # Updated to Node.js 22 (latest LTS)
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9
      
      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'  # Capacitor 8 / AGP 8.13 require Java 21
      
      - name: Setup Android SDK
        run: |
          # Android SDK is pre-installed on GitHub runners
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          # Locate sdkmanager (cmdline-tools path varies between runner images)
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          # Accept all licenses
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          # Install packages matching variables.gradle (compileSdk 36)
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build web assets
        run: pnpm build
      
      - name: Sync Capacitor
        run: pnpm exec cap sync android
      
      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      
      - name: Sign APK (Optional - using debug key)
        run: |
          echo "APK built successfully!"
          ls -lh android/app/build/outputs/apk/debug/
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: modded-liner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      
      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}


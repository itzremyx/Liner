name: Build Android APK

on:
  workflow_dispatch: # Manuel trigger
  push:
    branches:
      - modded
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04  # Explicitly use Ubuntu 24.04 to avoid migration warning
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'  # Updated to Node.js 22 (latest LTS)
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9
      
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.3
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build web assets
        run: pnpm build
      
      - name: Sync Capacitor
        run: |
          pnpm add @capacitor/cli @capacitor/core @capacitor/android
          npx cap sync android
      
      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      
      - name: Sign APK (Optional - using debug key)
        run: |
          echo "APK built successfully!"
          ls -lh android/app/build/outputs/apk/debug/
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: modded-liner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      
      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}

